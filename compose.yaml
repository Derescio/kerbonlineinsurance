# Local Postgres for the `integration` test project (plan/engineering.md section 4).
# `vp run db:test:up` before `vp test`. Same major version as Neon and the CI service (18).
services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kerb_test
    # 5433, so it doesn't clash with a Postgres already on 5432
    ports:
      - "5433:5432"
    # Throwaway data in memory: every test run rebuilds the schema anyway. Postgres 18 images keep
    # their data under /var/lib/postgresql (not .../data as in 17 and earlier).
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kerb_test"]
      interval: 2s
      timeout: 3s
      retries: 15
