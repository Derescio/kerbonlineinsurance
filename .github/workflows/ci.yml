name: CI

# No paths-ignore: `ci` is a required check, and a skipped workflow leaves plan-only PRs stuck on "Expected"
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

# A new push to the same branch or PR cancels the older run
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres for the `integration` test project (4.1). Same major version as Neon (18). It starts
    # empty on every run; the test setup applies all migrations before the tests.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kerb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kerb_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/kerb_test
    steps:
      # main only takes release PRs (from staging) and hotfixes; everything else goes into staging
      - name: Check PR source for main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            staging|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::PRs into main must come from staging (release) or hotfix/*, not '$HEAD_REF'. Open this PR into staging instead."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs Vite+, Node 24 and pnpm, runs `vp install`, and caches the pnpm store
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true

      - run: vp check

      # A schema change must ship with its migration (plan/engineering.md section 3). Neither step
      # needs a database.
      - name: Check for migration drift
        run: |
          vp run db:generate
          if [ -n "$(git status --porcelain drizzle/)" ]; then
            git status --porcelain drizzle/
            echo "::error::The schema changed but no migration is committed. Run 'vp run db:generate', review the SQL and commit it."
            exit 1
          fi
          vp run db:check

      # Chromium for the `component` test project (Vitest browser mode). Cached by Playwright version.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vp exec playwright install --with-deps chromium
      # The browser is cached but its system libraries aren't
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: vp exec playwright install-deps chromium

      - run: vp test
      - run: vp build

      # Fails on high or critical advisories in production dependencies
      - run: pnpm audit --prod --audit-level high
