allowBuilds:
  esbuild: true
  lightningcss: true
  # posthog-js dependency; its postinstall only prints a funding banner
  core-js: false
onlyBuiltDependencies:
  - esbuild
  - lightningcss
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
  # @vercel/functions → @vercel/oidc → @vercel/cli-config pins zod 4.1.11 (GHSA-mrhx-c7xc-m3w5,
  # fixed in 4.6.6). Drop once a @vercel/functions release depends on a patched zod.
  "@vercel/cli-config>zod": ^4.6.6
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
